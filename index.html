<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Professional To-Do List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .completed { text-decoration: line-through; opacity: 0.5; }
    </style>
</head> 
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl p-6">
        <h1 class="text-2xl font-bold text-slate-800 mb-6">🎯 Task Manager</h1>

        <div class="flex flex-col gap-3 mb-6">
            <input type="text" id="taskInput" placeholder="Apa yang ingin dikerjakan?" 
                class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
            
            <div class="flex gap-2">
                <select id="prioritySelect" class="bg-slate-100 px-3 py-2 rounded-lg text-sm focus:outline-none">
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                </select>
                <button id="addBtn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition">
                    Tambah Tugas
                </button>
            </div>
        </div>

<div class="flex gap-2 mb-4">
    <button id="filterAll" class="text-xs bg-slate-800 text-white px-3 py-1 rounded-full transition-colors">Semua</button>
    
    <button id="filterActive" class="text-xs bg-slate-100 text-slate-600 px-3 py-1 rounded-full hover:bg-slate-200 transition-colors">Belum Selesai</button>
</div>

        <ul id="todoList" class="space-y-3">
            <li class="flex items-center justify-between p-3 bg-slate-50 rounded-lg border border-slate-100">
                <div class="flex items-center gap-3">
                    <input type="checkbox" class="w-5 h-5 rounded border-slate-300 text-blue-600">
                    <span class="text-slate-700">Contoh Tugas Pertama</span>
                </div>
                <button class="text-red-400 hover:text-red-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                </button>
            </li>
        </ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
